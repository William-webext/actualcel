<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#12141a" />
<title>ActualCel</title>
<style>
  :root {
    --bg: #12141a;
    --surface: #1b1e27;
    --surface-2: #242836;
    --border: #2e3342;
    --text: #eef0f4;
    --text-dim: #9aa0af;
    --accent: #5b8cff;
    --expense: #ff5b6a;
    --income: #35d08a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font-family: inherit; }

  .screen { min-height: 100dvh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* --- Login --- */
  #loginScreen { align-items: center; justify-content: center; padding: 24px; gap: 18px; }
  #loginScreen h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-dim); margin: 0 0 8px; }
  #pinInput {
    width: 100%; max-width: 280px; text-align: center; letter-spacing: 0.5em;
    font-size: 1.6rem; padding: 16px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  #pinInput:focus { outline: 2px solid var(--accent); }
  #unlockBtn {
    width: 100%; max-width: 280px; padding: 14px; border-radius: var(--radius);
    border: none; background: var(--accent); color: white; font-size: 1.05rem; font-weight: 600;
  }
  #loginError { color: var(--expense); font-size: 0.9rem; min-height: 1.2em; }

  /* --- Main --- */
  #mainScreen { padding: 0 0 96px; }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; background: rgba(18,20,26,0.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  .statusDot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-dim); display: inline-block; margin-right: 8px; }
  .statusDot.ok { background: var(--income); }
  .statusDot.err { background: var(--expense); }
  #logoutBtn { background: none; border: none; color: var(--text-dim); font-size: 0.85rem; padding: 8px; }

  form { padding: 18px; display: flex; flex-direction: column; gap: 18px; max-width: 480px; margin: 0 auto; }

  .segmented { display: flex; background: var(--surface); border-radius: var(--radius); padding: 4px; border: 1px solid var(--border); }
  .segmented button {
    flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-dim);
    border-radius: 10px; font-size: 0.95rem; font-weight: 600;
  }
  .segmented button.active.expense { background: var(--expense); color: white; }
  .segmented button.active.income { background: var(--income); color: white; }

  .amountWrap {
    display: flex; align-items: baseline; justify-content: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 12px;
  }
  .amountWrap span { font-size: 1.6rem; color: var(--text-dim); }
  #amount {
    border: none; background: transparent; color: var(--text); font-size: 2.6rem; font-weight: 700;
    width: 100%; text-align: center;
  }
  #amount:focus { outline: none; }

  label { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px; }
  .field { display: flex; flex-direction: column; }
  select, input[type="text"], input[type="date"] {
    width: 100%; padding: 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 1rem;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); }

  .saveBar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  #saveBtn {
    width: 100%; max-width: 480px; margin: 0 auto; display: block;
    padding: 16px; border-radius: var(--radius); border: none;
    background: var(--accent); color: white; font-size: 1.05rem; font-weight: 700;
  }
  #saveBtn:disabled { opacity: 0.6; }

  #toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 0.9rem;
    opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { border-color: var(--expense); color: var(--expense); }
</style>
</head>
<body>

<div id="loginScreen" class="screen">
  <h1>Sblocca ActualCel</h1>
  <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" />
  <button id="unlockBtn">Sblocca</button>
  <div id="loginError"></div>
</div>

<div id="mainScreen" class="screen hidden">
  <header>
    <h1><span id="statusDot" class="statusDot"></span>ActualCel</h1>
    <button id="logoutBtn">Esci</button>
  </header>

  <form id="txForm">
    <div class="segmented">
      <button type="button" id="btnExpense" class="active expense">Uscita</button>
      <button type="button" id="btnIncome" class="income">Entrata</button>
    </div>

    <div class="amountWrap">
      <span>€</span>
      <input id="amount" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" />
    </div>

    <div class="field">
      <label for="account">Conto</label>
      <select id="account" required></select>
    </div>

    <div class="field">
      <label for="payee">Beneficiario</label>
      <input id="payee" type="text" list="payeeList" autocomplete="off" placeholder="Chi hai pagato / da chi hai ricevuto" />
      <datalist id="payeeList"></datalist>
    </div>

    <div class="field">
      <label for="category">Categoria</label>
      <select id="category">
        <option value="">— nessuna —</option>
      </select>
    </div>

    <div class="field">
      <label for="date">Data</label>
      <input id="date" type="date" required />
    </div>

    <div class="field">
      <label for="notes">Note</label>
      <input id="notes" type="text" autocomplete="off" placeholder="Opzionale — usa #tag per un tag" />
    </div>
  </form>

  <div class="saveBar">
    <button id="saveBtn" type="submit" form="txForm">Salva</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  var state = {
    type: 'expense',
    meta: null,
  };

  var loginScreen = document.getElementById('loginScreen');
  var mainScreen = document.getElementById('mainScreen');
  var pinInput = document.getElementById('pinInput');
  var unlockBtn = document.getElementById('unlockBtn');
  var loginError = document.getElementById('loginError');
  var statusDot = document.getElementById('statusDot');
  var logoutBtn = document.getElementById('logoutBtn');
  var btnExpense = document.getElementById('btnExpense');
  var btnIncome = document.getElementById('btnIncome');
  var amountInput = document.getElementById('amount');
  var accountSelect = document.getElementById('account');
  var payeeInput = document.getElementById('payee');
  var payeeList = document.getElementById('payeeList');
  var categorySelect = document.getElementById('category');
  var dateInput = document.getElementById('date');
  var notesInput = document.getElementById('notes');
  var txForm = document.getElementById('txForm');
  var saveBtn = document.getElementById('saveBtn');
  var toast = document.getElementById('toast');

  function showToast(msg, isError) {
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  function todayLocalISO() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  function setType(type) {
    state.type = type;
    btnExpense.classList.toggle('active', type === 'expense');
    btnIncome.classList.toggle('active', type === 'income');
    renderCategories();
  }

  function renderCategories() {
    if (!state.meta) return;
    var groups = state.type === 'income' ? state.meta.incomeGroups : state.meta.expenseGroups;
    categorySelect.innerHTML = '<option value="">— nessuna —</option>';
    groups.forEach(function (g) {
      if (!g.categories.length) return;
      var og = document.createElement('optgroup');
      og.label = g.name;
      g.categories.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        og.appendChild(opt);
      });
      categorySelect.appendChild(og);
    });
  }

  function populateAccounts(accounts) {
    accountSelect.innerHTML = '';
    accounts.forEach(function (a) {
      var opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name + (a.offbudget ? ' (fuori budget)' : '');
      accountSelect.appendChild(opt);
    });
    var remembered = localStorage.getItem('actualcel_account');
    if (remembered && accounts.some(function (a) { return a.id === remembered; })) {
      accountSelect.value = remembered;
    }
  }

  function populatePayees(payees) {
    payeeList.innerHTML = '';
    payees.forEach(function (p) {
      var opt = document.createElement('option');
      opt.value = p.name;
      payeeList.appendChild(opt);
    });
  }

  function loadMeta() {
    return fetch('/api/meta').then(function (r) {
      if (!r.ok) throw new Error('meta_failed');
      return r.json();
    }).then(function (data) {
      state.meta = data;
      populateAccounts(data.accounts);
      populatePayees(data.payees);
      renderCategories();
      statusDot.classList.add('ok');
      statusDot.classList.remove('err');
    }).catch(function () {
      statusDot.classList.add('err');
      statusDot.classList.remove('ok');
      showToast('Budget non ancora pronto, riprovo…', true);
      setTimeout(loadMeta, 4000);
    });
  }

  function resetTransientFields() {
    amountInput.value = '';
    payeeInput.value = '';
    notesInput.value = '';
    dateInput.value = todayLocalISO();
    amountInput.focus();
  }

  function checkSession() {
    return fetch('/api/session').then(function (r) { return r.json(); }).then(function (d) {
      if (d.authed) {
        loginScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        dateInput.value = todayLocalISO();
        loadMeta();
      } else {
        loginScreen.classList.remove('hidden');
        mainScreen.classList.add('hidden');
        pinInput.focus();
      }
    });
  }

  unlockBtn.addEventListener('click', doLogin);
  pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

  function doLogin() {
    var pin = pinInput.value;
    if (!pin) return;
    loginError.textContent = '';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pin }),
    }).then(function (r) {
      if (r.ok) {
        pinInput.value = '';
        checkSession();
      } else if (r.status === 429) {
        loginError.textContent = 'Troppi tentativi, riprova più tardi.';
      } else {
        loginError.textContent = 'PIN errato.';
      }
    }).catch(function () {
      loginError.textContent = 'Errore di rete.';
    });
  }

  logoutBtn.addEventListener('click', function () {
    fetch('/api/logout', { method: 'POST' }).then(checkSession);
  });

  btnExpense.addEventListener('click', function () { setType('expense'); });
  btnIncome.addEventListener('click', function () { setType('income'); });

  accountSelect.addEventListener('change', function () {
    localStorage.setItem('actualcel_account', accountSelect.value);
  });

  amountInput.addEventListener('input', function () {
    // consente sia virgola che punto come separatore decimale
    var v = amountInput.value.replace(/[^0-9.,]/g, '');
    amountInput.value = v;
  });

  txForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var raw = amountInput.value.replace(',', '.');
    var amount = parseFloat(raw);
    if (!amount || amount <= 0) {
      showToast('Inserisci un importo valido', true);
      amountInput.focus();
      return;
    }
    if (!accountSelect.value) {
      showToast('Seleziona un conto', true);
      return;
    }
    saveBtn.disabled = true;
    fetch('/api/transaction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        accountId: accountSelect.value,
        type: state.type,
        amount: amount,
        payeeName: payeeInput.value,
        categoryId: categorySelect.value || null,
        date: dateInput.value,
        notes: notesInput.value,
      }),
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      if (!res.ok) throw new Error(res.data && res.data.error);
      showToast('Salvato ✓');
      resetTransientFields();
      loadMeta(); // aggiorna elenco beneficiari se ne è stato creato uno nuovo
    }).catch(function () {
      showToast('Salvataggio fallito, riprova', true);
    }).finally(function () {
      saveBtn.disabled = false;
    });
  });

  checkSession();
})();
</script>
</body>
</html>
